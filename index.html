<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>نادي شباب المدينة الدبة</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;900&display=swap">

<style>
:root{
  --red:#5a0508;
  --deep:#3a0203;
  --white:#fffaf8;
  --tint:#f5eae8;
  --ink:#2a0a0b;
}

*{
  box-sizing:border-box;
  margin:0;
}

body{
  font-family:Cairo,Tahoma,sans-serif;
  background:var(--white);
  color:var(--ink);
  line-height:1.9;
}

/* رأس الموقع */

header{
  background:radial-gradient(
    circle at 50% 30%,
    var(--red),
    var(--deep)
  );
  color:var(--white);
  text-align:center;
  padding:35px 20px;
}

header h1{
  font-size:clamp(1.8rem,7vw,2.8rem);
  font-weight:900;
  line-height:1.3;
}

header p{
  opacity:.85;
  margin-top:5px;
}

/* القائمة */

nav{
  position:sticky;
  top:0;
  z-index:5;
  display:flex;
  background:var(--white);
  border-bottom:3px solid var(--red);
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

nav a{
  flex:1;
  text-align:center;
  padding:12px 4px;
  font-weight:600;
  color:var(--red);
  text-decoration:none;
  transition:.2s;
}

nav a:hover{
  background:var(--tint);
}

nav a[aria-current="page"]{
  background:var(--red);
  color:var(--white);
}

/* المحتوى */

main{
  max-width:760px;
  margin:auto;
  padding:32px 20px 48px;
}

h2{
  font-size:1.7rem;
  font-weight:900;
  color:var(--red);
  margin-bottom:12px;
}

/* عن النادي */

.pts{
  display:grid;
  gap:12px;
  margin-top:20px;
}

.pt{
  border-inline-start:6px solid var(--red);
  background:var(--tint);
  padding:10px 16px;
}

.pt b{
  color:var(--red);
}

/* اللاعبين والمتجر */

.grid{
  display:grid;
  grid-template-columns:
  repeat(auto-fill,minmax(150px,1fr));
  gap:16px;
  margin-top:16px;
}

.card{
  background:var(--tint);
  border-bottom:4px solid var(--red);
  overflow:hidden;
}

.card .ph{
  aspect-ratio:1;
  background:var(--red) center/cover;
  display:grid;
  place-items:center;
  color:var(--white);
  font-size:2.6rem;
  font-weight:900;
}

.card .in{
  padding:10px 12px;
}

.card b{
  display:block;
}

.card small{
  color:#6b3a3c;
}

.buy{
  display:block;
  margin-top:8px;
  background:var(--red);
  color:var(--white);
  text-align:center;
  padding:4px;
  text-decoration:none;
  font-weight:600;
}

.empty{
  background:var(--tint);
  padding:20px;
  border:2px dashed var(--red);
  margin-top:12px;
}

/* العضوية الإلكترونية */

.membership{
  background:var(--tint);
  border:2px solid var(--red);
  padding:25px 20px;
  margin-top:20px;
  text-align:center;
}

.membership h3{
  color:var(--red);
  font-size:1.4rem;
  margin-bottom:8px;
}

.membership p{
  color:#633a3b;
}

/* المستقبل */

.future{
  margin-top:18px;
  font-size:.9rem;
  opacity:.75;
}

/* الفوتر */

footer{
  background:var(--deep);
  color:var(--white);
  text-align:center;
  padding:20px;
  font-size:.9rem;
}

/* الهاتف */

@media(max-width:600px){

  nav a{
    font-size:12px;
    padding:10px 3px;
  }

  header{
    padding:30px 15px;
  }

  header h1{
    font-size:1.8rem;
  }

}
</style>
</head>

<body>

<header>
  <h1>نادي شباب المدينة الدبة</h1>
  <p>تأسس عام 2013</p>
</header>

<nav aria-label="القوائم">

  <a href="#about">
    عن النادي
  </a>

  <a href="#players">
    اللاعبون
  </a>

  <a href="#membership">
    العضوية الإلكترونية
  </a>

  <a href="#store">
    المتجر الإلكتروني
  </a>

</nav>

<main id="view"></main>

<footer>
  © نادي شباب المدينة الدبة
</footer>

<script src="data.js"></script>

<script>

const esc=s=>String(s).replace(
  /[&<>"]/g,
  c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;"
  }[c])
);

const photo=(p,fb)=>
  p
  ? `<div class="ph" style="background-image:url('${esc(p)}')"></div>`
  : `<div class="ph">${esc(fb)}</div>`;


const views={


/* عن النادي */

about(){

  const a=SITE.about;

  return `

    <h2>عن النادي</h2>

    <p>
      ${esc(a.intro)}
    </p>

    <div class="pts">

      ${a.points.map(p=>

        `<div class="pt">

          <b>${esc(p.title)}:</b>

          ${esc(p.text)}

        </div>`

      ).join("")}

    </div>

    <p style="margin-top:20px">

      ${esc(a.contact)}

    </p>

  `;

},


/* اللاعبون */

players(){

  const l=SITE.players;

  return `

    <h2>اللاعبون</h2>

    ${
      l.length

      ?

      `<div class="grid">

        ${l.map(p=>

          `<div class="card">

            ${photo(
              p.photo,
              p.number ?? ""
            )}

            <div class="in">

              <b>
                ${esc(p.name)}
              </b>

              <small>

                ${esc(p.position || "")}

                ${
                  p.number
                  ? " • رقم " + esc(p.number)
                  : ""
                }

              </small>

            </div>

          </div>`

        ).join("")}

      </div>`

      :

      `<div class="empty">

        لم تُضف قائمة اللاعبين بعد.

      </div>`
    }

  `;

},


/* العضوية الإلكترونية */

membership(){

  return `

    <h2>
      العضوية الإلكترونية
    </h2>

    <div class="membership">

      <h3>
        عضوية نادي شباب المدينة الدبة
      </h3>

      <p>
        قريبًا سيتم إطلاق خدمة العضوية الإلكترونية
        لنادي شباب المدينة الدبة.
      </p>

      <p style="margin-top:10px">

        ستكون هذه الصفحة مخصصة لعضوية
        جماهير ومحبي النادي.

      </p>

      <div class="future">

        سيتم تطوير نظام العضوية في المراحل القادمة.

      </div>

    </div>

  `;

},


/* المتجر */

store(){

  const l=SITE.products;

  return `

    <h2>
      المتجر الإلكتروني
    </h2>

    ${
      l.length

      ?

      `<div class="grid">

        ${l.map(p=>

          `<div class="card">

            ${photo(
              p.photo,
              "★"
            )}

            <div class="in">

              <b>
                ${esc(p.name)}
              </b>

              <small>
                ${esc(p.price || "")}
              </small>

              <a
                class="buy"
                href="https://wa.me/${esc(SITE.whatsapp)}?text=${encodeURIComponent(
                  "أرغب بطلب: " + p.name
                )}"
              >
                اطلب عبر واتساب
              </a>

            </div>

          </div>`

        ).join("")}

      </div>`

      :

      `<div class="empty">

        لا توجد منتجات حاليًا.

        ترقبوا قميص النادي ومنتجاته قريبًا.

      </div>`
    }

  `;

}

};


/* تشغيل الصفحات */

function route(){

  const k=
    (location.hash || "#about").slice(1);

  const v=
    views[k]
    ? k
    : "about";

  document.getElementById("view")
    .innerHTML=views[v]();

  document
    .querySelectorAll("nav a")
    .forEach(a=>{

      if(a.hash === "#" + v){

        a.setAttribute(
          "aria-current",
          "page"
        );

      }else{

        a.removeAttribute(
          "aria-current"
        );

      }

    });

}


/* تغيير الصفحة */

addEventListener(
  "hashchange",
  route
);

route();

</script>

</body>
    </html>
